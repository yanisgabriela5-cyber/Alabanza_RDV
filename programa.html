<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Programa · Roca de Vida Alabanza</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#11131c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Programa RDV">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body { padding: calc(14px + var(--safe-t)) 14px calc(30px + var(--safe-b)); }
    .pg { max-width: 760px; margin: 0 auto; }
    .pg-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .pg-head img { width: 44px; height: 44px; border-radius: 12px; }
    .pg-head h1 { font-size: 19px; margin: 0; }
    .pg-head small { color: var(--texto-3); font-size: 12px; }
    .pg-mes { display: flex; align-items: center; justify-content: space-between; margin: 0 0 14px; }
    .pg-mes b { font-size: 17px; }
    .pg-dia { border-left: 4px solid var(--acento); }
    .pg-dia.pasado { opacity: .55; }
    .pg-dia.proximo { box-shadow: 0 0 0 1px var(--acento) inset; }
    .pg-dia h2 { font-size: 16px; margin: 0 0 2px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
    .pg-dia .cuando { color: var(--texto-2); font-size: 13.5px; }
    .pg-voces { margin: 10px 0 4px; font-size: 14px; }
    .pg-voces b { color: var(--acento-2); }
    .pg-sub { font-size: 11.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .6px; color: var(--texto-2); margin: 12px 0 4px; }
    .pg-can { border-top: 1px solid var(--linea); padding: 9px 0; }
    .pg-can:first-of-type { border-top: 0; }
    .pg-can-top { display: flex; gap: 10px; align-items: flex-start; }
    .pg-can .n { color: var(--texto-3); font-weight: 700; min-width: 18px; }
    .pg-can .info { flex: 1; min-width: 0; }
    .pg-can .info b { display: block; }
    .pg-can .info small { color: var(--texto-2); }
    .pg-can .acc { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .pg-letra { margin: 8px 0 2px 28px; background: var(--bg-2); border-radius: 10px; padding: 10px 12px; font-size: 15.5px; line-height: 1.45; white-space: pre-wrap; }
    .pg-letra .sec { display: block; font-weight: 800; font-size: 11.5px; text-transform: uppercase; letter-spacing: .7px; color: var(--info); margin: 10px 0 2px; }
    .pg-letra .sec:first-child { margin-top: 0; }
    .pg-vacio { text-align: center; color: var(--texto-3); padding: 40px 10px; }
  </style>
</head>
<body>
  <div class="pg" id="pg"><div class="pg-vacio">Cargando…</div></div>
  <div id="toast" class="toast" hidden></div>
  <script type="module" src="js/programa.js"></script>
</body>
</html>
